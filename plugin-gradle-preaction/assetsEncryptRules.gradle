import org.gradle.api.file.Directory
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.FileSystemOperations
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

import javax.inject.Inject
import java.nio.file.Paths

/** 在合并后的独立产物中处理应用 assets，保留依赖库资源和源文件。 */
abstract class EncryptAssetsTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getInputDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ListProperty<Directory> getSourceDirs()

    @Input
    abstract Property<String> getXorKey()

    @Input
    abstract ListProperty<String> getIgnoreFiles()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    private static void xorTransform(byte[] data, byte[] key, int size) {
        for (int i = 0; i < size; i++) {
            data[i] = (data[i] ^ key[i % key.length]) as byte
        }
    }

    private static void encryptFile(File sourceFile, File targetFile, String xorKey, int chunkSize) {
        byte[] keyBytes = xorKey.getBytes('UTF-8')
        targetFile.withOutputStream { output ->
            sourceFile.withInputStream { input ->
                byte[] buffer = new byte[chunkSize]
                int size
                while ((size = input.read(buffer)) != -1) {
                    EncryptAssetsTask.xorTransform(buffer, keyBytes, size)
                    output.write(buffer, 0, size)
                }
            }
        }
    }

    @TaskAction
    void encryptAssets() {
        def inputRoot = inputDir.get().asFile
        def outputRoot = outputDir.get().asFile
        def applicationPaths = new HashSet<String>()
        sourceDirs.get().each { directory ->
            def root = directory.asFile
            if (root.isDirectory()) {
                root.eachFileRecurse { file ->
                    if (file.isFile()) {
                        applicationPaths.add(root.toPath().relativize(file.toPath()).toString())
                    }
                }
            }
        }
        fileSystemOperations.sync {
            from(inputRoot)
            into(outputRoot)
        }
        def ignored = ignoreFiles.get()
        def key = xorKey.get()
        if (key.isEmpty()) throw new GradleException('Asset encryption key must not be empty')
        inputRoot.eachFileRecurse { file ->
            if (file.isFile()) {
                def relative = inputRoot.toPath().relativize(file.toPath()).toString()
                if (applicationPaths.contains(relative) && !ignored.any { Paths.get(relative).endsWith(Paths.get(it)) }) {
                    EncryptAssetsTask.encryptFile(file, new File(outputRoot, relative), key, 4096)
                }
            }
        }
    }
}

def assetsArtifact = project.extensions.extraProperties.get('assetsEncryptionArtifact')

androidComponents {
    onVariants(selector().all()) { variant ->
        def transformTask = tasks.register("modifyCopiedAssetsFor${variant.name.capitalize()}", EncryptAssetsTask) {
            xorKey.set(providers.gradleProperty('encrypt.assets.key'))
            ignoreFiles.set(providers.gradleProperty('encrypt.assets.ignore_list').orElse('').map { value ->
                value.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
            })
            sourceDirs.set(variant.sources.assets.all.map { layers -> layers.flatten() })
        }
        variant.artifacts.use(transformTask)
                .wiredWithDirectories({ it.inputDir }, { it.outputDir })
                .toTransform(assetsArtifact)
    }
}
