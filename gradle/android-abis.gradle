// 主工程和 child-monitor 独立工程统一只构建、打包 ARM 架构。
subprojects { androidProject ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
        androidProject.pluginManager.withPlugin(pluginId) {
            androidProject.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.defaultConfig.ndk.abiFilters.clear()
                android.defaultConfig.ndk.abiFilters.addAll(['armeabi-v7a', 'arm64-v8a'])
            }
        }
    }
}
