import com.android.build.api.variant.BuildConfigField

plugins {
    id 'com.android.library'
}

android {
    namespace='com.au.module_androidui'
    compileSdk=gradle.ext.compileSdk

    defaultConfig {
        minSdk=gradle.ext.minSdk

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled=false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility=gradle.ext.sourceCompatibility
        targetCompatibility=gradle.ext.targetCompatibility
    }
    buildFeatures {
        viewBinding=true
        buildConfig=true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        [FONT_NORMAL_PATH: 'app.font.normal', FONT_MEDIUM_PATH: 'app.font.medium',
         FONT_BOLD_PATH: 'app.font.bold', FONT_NUMBER_PATH: 'app.font.number',
         FONT_NUMBER_MEDIUM_PATH: 'app.font.number.medium', FONT_NUMBER_BOLD_PATH: 'app.font.number.bold'].each { field, property ->
            variant.buildConfigFields.put(field, providers.gradleProperty(property).orElse('').map { value ->
                new BuildConfigField('String', groovy.json.JsonOutput.toJson(value), '字体资源路径')
            })
        }
    }
}

dependencies {
    implementation(project(":Module-AndroidCommon"))
    implementation(project(":Module-AuSimplePermission"))
    implementation project(":Module-AndroidColor")

    implementation(platform(libs.koin.bom))
    implementation(libs.koin.android)
}
